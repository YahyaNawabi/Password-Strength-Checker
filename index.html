<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Strength Checker</title>
  <link rel="stylesheet" href="./Password Strength Checker.css">
</head>
<body>
    
  <div class="container">
    <h2>Check Password Strength</h2>
    <div class="input-wrapper">
      <input type="password" id="password" placeholder="Enter Password">
      <button class="toggle-btn" id="toggleBtn">Show</button>
    </div>
    <p id="message">Strength: <span id="strength"></span></p>
  </div>

  <script src="./Password Strength Checker.js"></script>
</body>
</html>
